name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build dependencies
        run: pip install -r requirements-build.txt
      - name: Build portable EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name DFIN_DSKEYS_Manager --collect-all send2trash DFIN_DSKEYS_Manager.py
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: '& "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" DFIN_DSKEYS_Manager.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: DFIN-DSKEYS-Windows
          path: |
            dist/DFIN_DSKEYS_Manager.exe
            installer/DFIN_DSKEYS_Manager_Setup_v2.1.exe
